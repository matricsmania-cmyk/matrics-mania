      (function() {
        var theme = localStorage.getItem('matricsmania-theme');
        if (theme === 'dark' || !theme) {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      })();
