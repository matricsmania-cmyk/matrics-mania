<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="bgVignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#252320" />
      <stop offset="50%" stop-color="#141311" />
      <stop offset="100%" stop-color="#080807" />
    </radialGradient>

    <!-- Metallic Gold Gradient Left Wing -->
    <linearGradient id="goldGradientLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8" />
      <stop offset="30%" stop-color="#ECC254" />
      <stop offset="70%" stop-color="#C4962C" />
      <stop offset="100%" stop-color="#8A6314" />
    </linearGradient>

    <!-- Metallic Gold Gradient Right Wing -->
    <linearGradient id="goldGradientRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C8" />
      <stop offset="30%" stop-color="#E5BA4B" />
      <stop offset="70%" stop-color="#B88A22" />
      <stop offset="100%" stop-color="#7E580F" />
    </linearGradient>

    <!-- Pure High-Contrast White Shading Left -->
    <linearGradient id="whiteShadeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F7F6F3" />
      <stop offset="100%" stop-color="#ECE9E2" />
    </linearGradient>

    <!-- Pure High-Contrast White Shading Right -->
    <linearGradient id="whiteShadeRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8E5DD" />
      <stop offset="35%" stop-color="#F9F8F6" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Emblem Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Textured Pitch-Black Canvas with Gold Accent Rim -->
  <rect width="1000" height="1000" rx="220" fill="url(#bgVignette)" />
  <rect width="972" height="972" x="14" y="14" rx="208" fill="none" stroke="#D4AF37" stroke-width="20" stroke-opacity="0.75" />

  <!-- Logo Group with Drop Shadow -->
  <g transform="translate(500, 500) scale(1.42) translate(-511, -518)" filter="url(#logoShadow)">
    <!-- White M Left Wing -->
    <path
      d="M 268 376 
         L 478 586 
         L 478 698 
         L 326 546 
         L 326 710 
         L 268 768 
         Z"
      fill="url(#whiteShadeLeft)"
    />

    <!-- White M Right Wing (Extended Upward Thrust) -->
    <path
      d="M 490 532 
         L 754 268 
         L 754 380 
         L 694 440 
         L 694 768 
         L 634 710 
         L 634 500 
         L 490 644 
         Z"
      fill="url(#whiteShadeRight)"
    />

    <!-- Gold Chevron Left Wing -->
    <path
      d="M 420 390 
         L 478 448 
         L 478 524 
         L 420 466 
         Z"
      fill="url(#goldGradientLeft)"
    />

    <!-- Gold Chevron Right Wing -->
    <path
      d="M 548 390 
         L 490 448 
         L 490 524 
         L 548 466 
         Z"
      fill="url(#goldGradientRight)"
    />
  </g>
</svg>

